[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ketris-mig"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["nvidia-ml-py", "kubernetes>=35,<37"]

[project.scripts]
ketris-mig-runtime = "ketris_mig.service:main"
ketris-mig-manifest = "ketris_mig.manifest:main"

[tool.setuptools.packages.find]
include = ["ketris_mig*"]
