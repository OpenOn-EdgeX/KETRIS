[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "ketris-institution-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["grpcio==1.82.1", "protobuf==7.35.1", "kubernetes==36.0.3"]
[project.optional-dependencies]
build = ["grpcio-tools==1.82.1"]
[project.scripts]
ketris-integration = "ketris_integration.client:main"
[tool.setuptools.packages.find]
where = ["src"]
