# [Exp_123 3-B] 배치 전 tp 대조 차단 — ValidatingAdmissionPolicy.
#
# ★왜 device-plugin Allocate 가 아니라 입장(admission)인가 — **구조적 이유다.**
#   device-plugin API 의 AllocateRequest 에는 **파드 식별자가 없다**(DevicesIds 뿐).
#   devID→pod 매핑은 kubelet 체크포인트에 **Allocate 이후에** 생긴다(watcher.go 가
#   그래서 class 를 '선기록 + 재시도'로 처리한다). 즉 Allocate 시점에는 어떤 모델을
#   올릴 파드인지 알 방법이 없다. 모델을 아는 유일한 시점이 입장이다.
#
# ★막는 방향은 하나뿐이다(device-plugin/npu_fit.go 근거):
#     요청 PE < tp  → 거부. 어차피 컨테이너 안에서 5초 뒤 'Not enough devices' 로 죽는다
#     요청 PE > tp  → **거부하지 않는다.** 실행은 된다(자원을 놀 뿐).
#                     거부로 만들면 tp=8 모델 26종이 8PE 를 못 받는다(Exp_122 §7 오류)
#   초과는 경고 대상이지 차단 대상이 아니다 — 경고는 플러그인 로그가 담당한다.
#
# ★카탈로그에 없는 모델·애노테이션 미선언은 **통과**시킨다. 모른다고 막지 않는다.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kraken-npu-fit
spec:
  failurePolicy: Ignore          # 정책 오류가 파드 생성을 막지 않게 (Exp_82 webhook 과 동지)
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: model
      expression: >-
        has(object.metadata.annotations) &&
        'keti.re.kr/npu-model' in object.metadata.annotations
        ? object.metadata.annotations['keti.re.kr/npu-model'] : ''
    - name: shortName
      expression: >-
        variables.model.contains('/')
        ? variables.model.split('/')[1] : variables.model
    - name: peReq
      expression: >-
        object.spec.containers.map(c,
          has(c.resources) && has(c.resources.limits) &&
          'keti.re.kr/npu-pe' in c.resources.limits
          ? int(c.resources.limits['keti.re.kr/npu-pe']) : 0).sum()
    - name: tp
      expression: >-
        params != null && has(params.data) && variables.shortName in params.data
        ? int(params.data[variables.shortName]) : 0
  validations:
    - expression: >-
        variables.tp == 0 || variables.peReq == 0 || variables.peReq >= variables.tp
      messageExpression: >-
        'NPU PE ' + string(variables.peReq) + '개 요청인데 모델 ' + variables.shortName +
        ' 은 tp=' + string(variables.tp) + ' 를 요구한다 — 컨테이너 안에서 ' +
        '"Not enough devices" 로 죽는다(약 5초 뒤). 배치 전에 거부한다.'
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kraken-npu-fit
spec:
  policyName: kraken-npu-fit
  validationActions: [Deny]
  paramRef:
    name: kraken-npu-catalog
    namespace: kube-system
    parameterNotFoundAction: Allow    # 카탈로그가 없으면 막지 않는다
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
