apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ketris-observer-reader}
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ketris-observer-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ketris-observer-reader}
subjects: [{kind: ServiceAccount, name: ketris-observer, namespace: ketris}]
