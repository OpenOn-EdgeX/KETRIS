apiVersion: v1
kind: Service
metadata: {name: ketris-dashboard, namespace: ketris}
spec:
  selector: {app: ketris-dashboard}
  ports: [{name: public, port: 8080, targetPort: public}]
---
apiVersion: v1
kind: Service
metadata: {name: ketris-dashboard-ingest, namespace: ketris}
spec:
  selector: {app: ketris-dashboard}
  ports: [{name: ingest, port: 8081, targetPort: ingest}]
