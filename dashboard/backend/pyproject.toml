[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ketris-dashboard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0", "httpx==0.28.1", "pydantic>=2.12,<3", "kubernetes>=35,<37", "nvidia-ml-py"]
[project.scripts]
ketris-dashboard = "ketris_dashboard.server:main"
ketris-observer = "ketris_dashboard.observer.service:main"
[tool.setuptools.packages.find]
include = ["ketris_dashboard*"]
