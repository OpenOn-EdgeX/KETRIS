# E1 — 가장 단순한 요청: keti.re.kr/lsu 만 limits 에 넣는다. 나머지는 전부 자동.
# (이미지는 예시 — CUDA 를 쓰는 아무 이미지나 된다. 코드 수정·특수 설정 불요)
apiVersion: v1
kind: Pod
metadata:
  name: e1-basic
  namespace: prism-guide
spec:
  restartPolicy: Never
  containers:
    - name: work
      image: prism-infer:opt
      imagePullPolicy: IfNotPresent
      command: ["python", "-u", "-c"]
      args:
        - |
          import torch, time
          a = torch.randn(4096, 4096, device="cuda")
          torch.cuda.synchronize()
          t0 = time.time(); n = 0
          while time.time() - t0 < 60:
              (a @ a).sum().item(); n += 1
          dt = time.time() - t0
          print(f"iters={n} dur={dt:.1f}s rate={n/dt:.2f} it/s")
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
          keti.re.kr/lsu: "60"
