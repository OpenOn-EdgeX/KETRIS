# E7 — 실패 예제: 노출량(240)을 넘는 요청은 Pending 으로 남는다.
# 사유는 kubectl describe pod / tools/prism_check.sh 로 확인.
apiVersion: v1
kind: Pod
metadata:
  name: e7-over
  namespace: prism-guide
spec:
  restartPolicy: Never
  containers:
    - name: work
      image: prism-infer:opt
      imagePullPolicy: IfNotPresent
      command: ["sleep", "300"]
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
          keti.re.kr/lsu: "300"
