# E8 — NPU(RNGD) PE 요청: keti.re.kr/npu-pe 를 1·2·4·8 로 요청하면 정렬된 PE 블록을 받는다.
# 받은 장치는 env KETI_NPU_DEVICES(furiosa-llm --devices 형식)·KETI_NPU_PE_RANGE 로 전달된다.
# ★주의: 공식 Qwen 아티팩트는 tp=4 라 실제 추론은 4PE 이상 필요(1·2PE 는 장치 부여만 된다).
apiVersion: v1
kind: Pod
metadata:
  name: e8-npu
  namespace: prism-guide
spec:
  restartPolicy: Never
  containers:
    - name: work
      image: prism-npu:qwen
      imagePullPolicy: IfNotPresent
      command: ["sleep", "120"]
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
          keti.re.kr/npu-pe: "2"
